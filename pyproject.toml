[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-lab"
version = "0.1.0"
description = "A sandbox for experimenting with the ARC-AGI benchmarks and abstraction formation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Will Boan", email = "waboan@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
stitch = ["stitch_core>=0.1"]  # library-learning engine; the loop runs without it (lazy-imported)
lsp = ["pygls>=2.0,<3"]  # `.ladder` language server (arc-lab lsp); lazy-imported, editor-only

[project.scripts]
arc-lab = "arc_lab.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pygls>=2.0,<3",  # in dev too, so mypy --strict + the gate cover the language server
]

[tool.hatch.build.targets.wheel]
packages = ["src/arc_lab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# `experiments/` holds lab-notebook artifacts — throwaway probe scripts kept for the record,
# not production code; don't hold them to the linter (mypy already scopes to src/tests only).
# `editors/` is the VS Code extension (TypeScript/JSON) — outside the Python toolchain entirely.
extend-exclude = ["experiments", "editors"]

[tool.ruff.lint]
# A sensible, strict-ish default. E/F pyflakes+pycodestyle, I isort, UP pyupgrade,
# B bugbear, SIM simplify, RUF ruff-specific, N naming, PL pylint subset.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "PLC", "PLE", "PLW"]
ignore = [
    "E501",     # line length handled by the formatter
    "PLC0415",  # we deliberately lazy-import heavy/optional deps (pyplot, stitch_core)
]

[tool.ruff.lint.per-file-ignores]
# Typer requires function-call defaults (typer.Option/Argument) for its options.
"src/arc_lab/cli/*.py" = ["B008"]

[tool.mypy]
# 3.12 so mypy can parse numpy 2.5's PEP 695 type stubs; runtime still supports 3.11.
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["matplotlib.*", "stitch_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # Heavy regression/research locks — they run real search inside the wake-sleep loop or over real
    # ARC datasets (E1-E9 abstraction formation; `dsl`/`dsl-sym`/`dsl-synth` benchmarks). Excluded from
    # the fast inner-loop run (`make test` = `-m 'not slow'`); the full gate (`make check`) runs them.
    "slow: a heavy regression/research lock (deselect with -m 'not slow')",
]
